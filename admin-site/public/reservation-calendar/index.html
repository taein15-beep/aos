<body data-page="reservation_calendar">
<div class="app">
  
  <main>
    
    <div class="page reservation-calendar-page">
      <div class="page-head calendar-page-head">
        <div><div class="breadcrumb">예약관리 &gt; 예약달력</div><h1>예약달력</h1><div class="desc">상품별 출발 일정과 예약 고객을 달력에서 확인할 수 있습니다.</div></div>
        <div class="head-actions"><span id="updatedAt">마지막 업데이트 -</span><button class="btn" id="pageRefresh" type="button">새로고침</button></div>
      </div>

      <p class="hint" role="note">초기 기획의 샘플 예약달력입니다. 실제 예약 데이터와 연결되어 있지 않으며, 상세 패널도 샘플 정보를 표시합니다.</p><section class="panel filter-panel" aria-labelledby="filterTitle">
        <div class="panel-head"><span id="filterTitle">검색 조건</span><button class="text-button" id="topReset" type="button">조건 초기화</button></div>
        <div class="panel-body">
          <form id="filterForm" class="filter-form">
            <div class="field"><label for="category1">대분류</label><select id="category1"><option value="">전체</option><option>국내여행</option><option>해외여행</option></select></div>
            <div class="field"><label for="category2">중분류</label><select id="category2"><option value="">전체</option></select></div>
            <div class="field"><label for="category3">소분류</label><select id="category3"><option value="">전체</option></select></div>
            <div class="field date-field"><label for="dateFrom">시작일</label><input id="dateFrom" type="date"></div>
            <div class="field date-field"><label for="dateTo">종료일</label><input id="dateTo" type="date"></div>
            <div class="quick-dates"><button type="button" data-range="month">이번 달</button><button type="button" data-range="next">다음 달</button><button type="button" data-range="3months">최근 3개월</button></div>
            <div class="field keyword-field"><label for="keyword">통합검색</label><input id="keyword" type="search" placeholder="상품명, 상품코드, 예약번호, 예약자명 검색"></div>
            <div class="field"><label for="seller">판매점</label><input id="seller" type="search" list="sellerList" placeholder="전체 판매점"><datalist id="sellerList"></datalist></div>
            <div class="field"><label for="reservationStatus">예약상태</label><select id="reservationStatus"><option value="">전체</option><option>접수</option><option>확정</option><option>대기</option><option>취소</option></select></div>
            <div class="field"><label for="paymentStatus">결제상태</label><select id="paymentStatus"><option value="">전체</option><option>미결제</option><option>부분결제</option><option>결제완료</option><option>환불</option></select></div>
            <div class="field"><label for="departureStatus">출발상태</label><select id="departureStatus"><option value="">전체</option><option>예약가능</option><option>출발확정</option><option>대기</option><option>마감</option><option>취소</option><option>행사종료</option></select></div>
            <div class="filter-actions"><button class="btn blue" type="submit">검색</button><button class="btn" id="reset" type="button">초기화</button></div>
          </form>
        </div>
      </section>

      <section class="summary-grid" id="summary" aria-label="예약 현황 요약"></section>

      <section class="panel calendar-panel">
        <div class="calendar-toolbar">
          <div class="month-controls"><button class="btn small" id="today" type="button">오늘</button><button class="icon-button" id="prev" type="button" aria-label="이전 기간">‹</button><button class="icon-button" id="next" type="button" aria-label="다음 기간">›</button><h2 id="periodTitle">2026년 8월</h2></div>
          <div class="view-controls"><div class="segmented" role="group" aria-label="보기 방식"><button class="active" data-view="month" type="button">월간</button><button data-view="week" type="button">주간</button><button data-view="list" type="button">목록</button></div><button class="btn small" id="refresh" type="button">새로고침</button></div>
        </div>
        <div class="legend" aria-label="출발상태 범례"><span class="available">예약가능</span><span class="confirmed">출발확정</span><span class="waiting">대기</span><span class="closed">마감</span><span class="cancelled">취소</span><span class="finished">행사종료</span></div>
        <div class="calendar-scroll">
          <div id="monthView"><div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="calendar-grid" id="calendarGrid"></div></div>
          <div id="weekView" hidden></div>
          <div id="listView" hidden></div>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="moreBackdrop" hidden><section class="day-modal" role="dialog" aria-modal="true" aria-labelledby="dayModalTitle"><header><h2 id="dayModalTitle"></h2><button class="icon-button" data-close-more type="button" aria-label="닫기">×</button></header><div id="dayModalList"></div></section></div>
<div class="drawer-overlay" id="drawerOverlay" hidden></div>
<aside class="detail-drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
  <header class="drawer-head"><div><span id="drawerStatus" class="status-badge"></span><h2 id="drawerTitle"></h2><p id="drawerMeta"></p></div><button class="icon-button" id="closeDrawer" type="button" aria-label="상세 패널 닫기">×</button></header>

    <div class="customer-list" id="customerList"></div>
  </div>
  <footer class="drawer-footer"><a class="btn" id="productLink" href="product_detail.html">상품 상세보기</a><a class="btn blue" id="reservationLink" href="reservation_list.html">예약목록 보기</a><button class="btn" id="print" type="button">인쇄</button><button class="btn" id="drawerCloseBottom" type="button">닫기</button></footer>
</aside>
<div class="calendar-toast" id="toast" role="status" aria-live="polite"></div>


<script>(() => {

  const categoryMap = {'국내여행':{'강원도':['철원','강릉','평창'],'경기도':['강화','수원','가평'],'제주도':['제주시','서귀포']},'해외여행':{'동남아':['다낭','방콕','하노이'],'일본':['도쿄','오사카','후쿠오카']}};

  function openDrawer(id){const e=events.find(x=>x.eventId===id);if(!e)return;state.selected=e;$('#drawerStatus').textContent=e.departureStatus;$('#drawerStatus').style.setProperty('--status',statusColor[e.departureStatus]);$('#drawerTitle').textContent=e.productName;$('#drawerMeta').textContent=`${e.productCode} · ${fmt(e.startDate)} ~ ${fmt(e.endDate)} / ${nights(e)}박 ${nights(e)+1}일`;$('#drawerSummary').innerHTML=[['예약 건수',`${e.reservations.length}건`],['총 예약 인원',`${people(e)}명`],['인원 구성',`성인 ${e.adultCount} · 소인 ${e.childCount} · 유아 ${e.infantCount}`],['담당자',e.managerName],['판매점 수',`${e.sellerCount}곳`],['출발상태',e.departureStatus]].map(x=>`<div><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('');const sellers=[...new Set(e.reservations.map(x=>x.sellerName))];$('#customerSeller').innerHTML='<option value="">판매점 전체</option>'+sellers.map(x=>`<option>${x}</option>`).join('');['customerSearch','customerSeller','customerReservationStatus','customerPaymentStatus'].forEach(id=>$('#'+id).value='');$('#productLink').href=`product_detail.html?productCode=${encodeURIComponent(e.productCode)}`;$('#reservationLink').href=`reservation_list.html?productCode=${encodeURIComponent(e.productCode)}&departureDate=${e.startDate}`;renderCustomers();$('#drawerOverlay').hidden=false;$('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('#closeDrawer').focus()}
  function closeDrawer(){if(!state.selected)return;$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');$('#drawerOverlay').hidden=true;document.body.style.overflow='';state.selected=null}
  function reset(){state.date=new Date(2026,7,1);HTMLFormElement.prototype.reset.call($('#filterForm'));populateCategories();setDates();state.filtered=[...events];render();toast('검색 조건을 초기화했습니다.')}
  $('#filterForm').addEventListener('submit',e=>{e.preventDefault();applyFilters()});$('#reset').onclick=$('#topReset').onclick=reset;$$('[data-range]').forEach(b=>b.onclick=()=>setDates(b.dataset.range));$('#prev').onclick=()=>{state.date.setMonth(state.date.getMonth()+(state.view==='week'?0:-1));if(state.view==='week')state.date.setDate(state.date.getDate()-7);render()};$('#next').onclick=()=>{state.date.setMonth(state.date.getMonth()+(state.view==='week'?0:1));if(state.view==='week')state.date.setDate(state.date.getDate()+7);render()};$('#today').onclick=()=>{state.date=new Date();render()};$$('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});document.addEventListener('click',e=>{const ev=e.target.closest('[data-event]');if(ev){$('#moreBackdrop').hidden=true;openDrawer(ev.dataset.event)}const more=e.target.closest('[data-more]');if(more)openMore(more.dataset.more);if(e.target.matches('[data-close-more]')||e.target===$('#moreBackdrop'))$('#moreBackdrop').hidden=true});$('#closeDrawer').onclick=$('#drawerCloseBottom').onclick=closeDrawer;$('#drawerOverlay').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#moreBackdrop').hidden=true;closeDrawer()}});['customerSearch','customerSeller','customerReservationStatus','customerPaymentStatus'].forEach(id=>$('#'+id).addEventListener(id==='customerSearch'?'input':'change',renderCustomers));$('#print').onclick=()=>window.print();function refresh(){const now=new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit'}).format(new Date());$('#updatedAt').textContent=`마지막 업데이트 ${now}`;render();toast('최신 예약 현황으로 갱신했습니다.')}$('#refresh').onclick=$('#pageRefresh').onclick=refresh;
  document.addEventListener('click', event => {
    const link = event.target.closest('a');
    if (link && /(?:product_detail|reservation_list|reservation_detail)\.html/.test(link.getAttribute('href') || '')) {
      event.preventDefault();
      toast('샘플 데이터입니다. 실제 상품·예약 조회는 기존 관리자 메뉴에서 이용하세요.');
    }
  });
  populateCategories();setDates();$('#sellerList').innerHTML=[...new Set(events.flatMap(e=>e.reservations.map(x=>x.sellerName)))].map(x=>`<option value="${x}">`).join('');refresh();
})();
